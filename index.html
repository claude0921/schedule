<style>
/* Layout: a work-month spreadsheet (28-day periods, 13 per year) with Excel-style formula bar above and notes below. */
:root {
  --bg: #e9ecef;
  --sheet: #ffffff;
  --grid: #3d3d3d;
  --ink: #111418;
  --ink-2: #5a6169;
  --accent: #1e6b43;
  --accent-ink: #ffffff;
  --today: #ffff00;
  --today-ink: #111418;
  --field-bg: #e2efda;
  --field-ink: #00753a;
  --red: #d00000;
  --sel: #1a56c4;
  --panel: #ffffff;
  --edit: #fffbe0;
  --font: "Microsoft JhengHei", "微軟正黑體", "Noto Sans TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171a; --sheet: #1c2024; --grid: #6e757c; --ink: #e8eaed; --ink-2: #9aa2aa; --accent: #4fbf86; --accent-ink: #0b1a12;
    --today: #6f6200; --today-ink: #ffffff; --field-bg: #1e3426; --field-ink: #52d98d; --red: #ff7b7b; --sel: #7ab0ff;
    --panel: #1c2024; --edit: #2b2a17; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171a; --sheet: #1c2024; --grid: #6e757c; --ink: #e8eaed; --ink-2: #9aa2aa; --accent: #4fbf86; --accent-ink: #0b1a12;
  --today: #6f6200; --today-ink: #ffffff; --field-bg: #1e3426; --field-ink: #52d98d; --red: #ff7b7b; --sel: #7ab0ff;
  --panel: #1c2024; --edit: #2b2a17; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 36px;
}
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.page { max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
h1 { margin: 0; font-size: 22px; letter-spacing: .04em; }
.sub { color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
.sub b { color: var(--ink); font-weight: 700; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { background: var(--panel); border: 1px solid var(--grid); border-radius: 4px; padding: 4px 12px; min-height: 34px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { color: var(--accent-ink); filter: brightness(1.08); }
.sync { font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; padding-left: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-2); display: inline-block; }
.sync.on i { background: var(--accent); }
.sync.warn i { background: #d98a00; }
.banner { background: var(--panel); border: 2px solid var(--red); border-radius: 4px; padding: 8px 10px; font-size: 14px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; }

/* formula bar */
.fbar { background: var(--panel); border: 1px solid var(--grid); display: grid; gap: 0; }
.fb-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 10px; border-bottom: 1px solid var(--grid); }
.ref { font-weight: 700; min-width: 44px; text-align: center; border: 1px solid var(--grid); padding: 0 8px; background: var(--sheet); }
.fx { font-style: italic; color: var(--ink-2); }
.fb-title { flex: 1; min-width: 160px; overflow-wrap: anywhere; }
.fb-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 1.5fr); }
.fb-body > div { padding: 8px 10px; min-width: 0; border-right: 1px solid var(--grid); }
.fb-body > div:last-child { border-right: 0; }
.fb-body h4 { margin: 0 0 4px; font-size: 12px; color: var(--ink-2); font-weight: 500; }
.fb-body pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font); font-size: 13px; max-height: 150px; overflow: auto; }
.fb-body pre.code { font-family: Consolas, "Courier New", monospace; font-size: 12px; white-space: pre; overflow-x: auto; }
.fb-body ul { margin: 0; padding-left: 18px; font-size: 13px; max-height: 150px; overflow: auto; }
.fb-body li + li { margin-top: 2px; }
@media (max-width: 860px) {
  .fb-body { grid-template-columns: minmax(0, 1fr); }
  .fb-body > div { border-right: 0; border-bottom: 1px solid var(--grid); }
  .fb-body > div:last-child { border-bottom: 0; }
}

/* sheet */
.sheet { background: var(--sheet); border: 1px solid var(--grid); overflow: auto; max-height: min(78vh, 900px); position: relative; }
table { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 13px; }
th, td {
  border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); background: var(--sheet);
  padding: 3px 5px; vertical-align: top; overflow: hidden; font-weight: 400; text-align: left;
}
th.c, td.c { text-align: left; }
thead th { position: sticky; z-index: 3; text-align: center; vertical-align: middle; height: 30px; padding: 2px 4px; }
thead tr.t1 th { top: 0; height: 28px; }
thead tr.t2 th { top: 28px; }
thead tr.t3 th { top: 58px; }
thead tr.t4 th { top: 88px; }
thead tr.t1 th { border-right: 0; border-bottom: 0; }
th.a, td.a { position: sticky; left: 0; z-index: 4; text-align: center; vertical-align: middle; white-space: pre-wrap; }
thead th.a { z-index: 6; }
td.a { background: var(--sheet); }
td.b, th.b { text-align: left; }
th.b { text-align: center; }
.hideB .b { display: none; }
td.b .txt, td.c .txt { overflow-y: auto; }
.tbl-scroll { max-height: 380px; overflow: auto; }
.red { color: var(--red); font-weight: 500; }
.txt { white-space: pre-wrap; overflow-wrap: anywhere; display: block; }
td.c.calc, td.c.center { text-align: center; }
td.c.calc .txt { text-align: center; }
td.c.manual .txt, td.b .txt { text-align: left; }
tr.green td { background: var(--field-bg); color: var(--field-ink); font-weight: 700; font-size: 15px; vertical-align: middle; }
tr.green td.a { color: var(--field-ink); }
.today { background: var(--today) !important; color: var(--today-ink) !important; }
td.sel, th.sel { outline: 2px solid var(--sel); outline-offset: -2px; z-index: 2; }
td.a.sel, th.a.sel { z-index: 5; }
td.c, td.b { cursor: cell; }
td.editing { padding: 0; background: var(--edit); }
td.editing textarea, .foot-txt textarea { width: 100%; height: 100%; min-height: 100%; border: 0; padding: 3px 5px; resize: none; background: var(--edit); font-size: 13px; line-height: 1.5; display: block; }
tr.divider td { border-bottom-width: 2px; }

.foot { background: var(--sheet); border: 1px solid var(--grid); }
.foot-h { padding: 5px 10px; border-bottom: 1px solid var(--grid); font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.foot-txt { padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 60px; cursor: cell; font-size: 13px; }
.foot-txt.sel { outline: 2px solid var(--sel); outline-offset: -2px; }
.foot-txt.editing { padding: 0; }
.foot-txt.editing textarea { min-height: 220px; }

.mgrset { background: var(--panel); border: 1px solid var(--grid); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.mgrset input { background: var(--sheet); border: 1px solid var(--grid); border-radius: 4px; padding: 4px 8px; min-height: 34px; font: inherit; color: inherit; }
.mgrset #mgrName { width: 160px; }
details.wm { background: var(--panel); border: 1px solid var(--grid); padding: 8px 12px; }
details.wm summary { cursor: pointer; font-weight: 500; }
.wm-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; margin-top: 10px; }
@media (max-width: 760px) { .wm-body { grid-template-columns: minmax(0, 1fr); } }
.wm table { table-layout: auto; width: 100%; }
.wm th, .wm td { text-align: center; padding: 3px 8px; border-color: var(--grid); }
.wm tr.cur td { background: var(--today); color: var(--today-ink); font-weight: 700; }
.wm tr.view td { outline: 2px solid var(--sel); outline-offset: -2px; }
.wm p { margin: 0 0 8px; font-size: 13px; }
.wm pre { margin: 0 0 10px; font-family: Consolas, "Courier New", monospace; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--sheet); border: 1px solid var(--grid); padding: 6px 8px; }
.tbl-scroll { overflow-x: auto; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 6px; font-size: 14px; z-index: 20; max-width: 90vw; }
.toast[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="page">
  <header class="top">
    <div>
      <h1>工作排程</h1>
      <div class="sub" id="wmTitle"></div>
      <div class="sub" id="nextLine"></div>
    </div>
    <div class="tools">
      <button class="btn" id="prev">‹ 上一工作月</button>
      <button class="btn primary" id="goToday">回到今天</button>
      <button class="btn" id="next">下一工作月 ›</button>
      <button class="btn" id="toggleB">隱藏子項目欄</button>
      <span class="sync" id="sync"><i></i><span>連線中…</span></span>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section class="fbar" aria-label="儲存格公式列" aria-live="polite">
    <div class="fb-top">
      <span class="ref" id="fbRef">—</span><span class="fx">fx</span>
      <span class="fb-title" id="fbTitle"></span>
      <button class="btn" id="fbEdit" hidden>編輯</button>
    </div>
    <div class="fb-body">
      <div><h4>目前顯示</h4><pre id="fbVal"></pre></div>
      <div><h4>Excel 公式</h4><pre class="code" id="fbF"></pre></div>
      <div><h4>怎麼算出來的</h4><ul id="fbWhy"></ul></div>
    </div>
  </section>

  <div class="sheet" id="sheet" tabindex="0" aria-label="工作月排程表，方向鍵移動，Enter 編輯">
    <table id="tbl"></table>
  </div>

  <section class="foot" aria-label="備註">
    <div class="foot-h"><span>※ 備註（原檔 A22）</span><span>點一下選取，雙擊或按 Enter 編輯</span></div>
    <div class="foot-txt" id="footTxt" data-k="foot"></div>
  </section>

  <section class="mgrset" aria-label="經理會議設定">
    <b>經理會議設定</b>
    <input type="text" id="mgrName" maxlength="20" aria-label="會議名稱">
    <input type="date" id="mgrS" aria-label="開始日">
    <span>～</span>
    <input type="date" id="mgrE" aria-label="結束日">
    <span class="sub">第 5 列「經理會議倒數」依這三個欄位計算</span>
  </section>

  <details class="wm" id="wmBox">
    <summary>工作月對照表（原檔「工作月」工作表）</summary>
    <div class="wm-body">
      <div id="wmInfo"></div>
      <div class="tbl-scroll"><table id="wmTbl"></table></div>
    </div>
  </details>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var DAY = 86400000;
  var WDN = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

  /* ---------- dates & work months ----------
     Work month = 28 days, 13 per year. 民國114年第9工作月 (11409) began 2025-08-14 (工作月!E3). */
  function dnOf(y, m, d) { return Math.round(Date.UTC(y, m - 1, d) / DAY); }
  function fromDn(dn) { var o = new Date(dn * DAY); return { y: o.getUTCFullYear(), m: o.getUTCMonth() + 1, d: o.getUTCDate(), w: o.getUTCDay() }; }
  function iso(dn) { var o = fromDn(dn); return o.y + '-' + pad(o.m) + '-' + pad(o.d); }
  function slash(dn) { var o = fromDn(dn); return o.y + '/' + pad(o.m) + '/' + pad(o.d); }
  function md(dn) { var o = fromDn(dn); return o.m + '月' + o.d + '日'; }
  var ANCHOR = dnOf(2025, 8, 14), LEN = 28, N0 = 114 * 13 + 8;
  function wmOf(dn) {
    var idx = Math.floor((dn - ANCHOR) / LEN), n = N0 + idx;
    var year = Math.floor(n / 13), mo = ((n % 13) + 13) % 13 + 1, start = ANCHOR + idx * LEN;
    return { idx: idx, start: start, end: start + LEN - 1, dayno: dn - start + 1, year: year, mo: mo, code: year * 100 + mo };
  }
  function colName(n) { return n < 26 ? String.fromCharCode(65 + n) : String.fromCharCode(64 + Math.floor(n / 26)) + String.fromCharCode(65 + n % 26); }
  function localToday() { var d = new Date(); return dnOf(d.getFullYear(), d.getMonth() + 1, d.getDate()); }

  var todayDn = localToday();
  var viewIdx = wmOf(todayDn).idx;

  /* ---------- formulas (same logic as the Excel cells) ---------- */
  function prevMo(m) { return m === 1 ? 13 : m - 1; }                    // IF(LEFT(C2,2)-1=0,13,LEFT(C2,2)-1)
  function wdLabel(w) { return pad(w.mo) + '工第' + pad(w.dayno) + '天'; } // row 2
  function fieldInfo(w) {                                                // row 6
    var p = prevMo(w.mo), d = w.dayno;
    if (d === 9)  return { txt: p + '工\n業績核實\n(跑資料)', note: '上一工作月 ' + p + ' 的業績核實，開始跑資料' };
    if (d === 12) return { txt: p + '工\n業績核實\n(可查詢)', note: '上一工作月 ' + p + ' 的業績核實，資料可查詢' };
    if (d === 15) return { txt: pad(w.mo) + '工\n組織核實', note: '本工作月 ' + pad(w.mo) + ' 的組織核實（這一格不用減 1）' };
    if (d === 16) return { txt: p + '工大聯盟\n(申覆前)\n(彥方給資料)', note: '上一工作月 ' + p + ' 的大聯盟，申覆前，等彥方給資料' };
    if (d === 23) return { txt: p + '工大聯盟\n(申覆後)', note: '上一工作月 ' + p + ' 的大聯盟，申覆後' };
    return { txt: '', note: '' };
  }
  function routineInfo(w, wd) {                                          // row 7
    if (wd === 3) return { txt: '提醒交週報', note: '星期三 → 提醒交週報' + (w.dayno === 19 ? '（今天同時是第 19 天，但週三優先，不顯示 5PR報表）' : '') };
    if (w.dayno === 19) return { txt: '5PR報表', note: '日序第 19 天 → 5PR報表' };
    return { txt: '', note: '' };
  }

  function isoToDn(s) { var p = String(s).split('-').map(Number); return dnOf(p[0], p[1], p[2]); }
  function mgrCfg() {
    var m = meta.mgr || {};
    return { name: m.name || '淡水經理會議', start: m.start || '2026-12-07', end: m.end || '2026-12-09' };
  }

  });
  $('tbl').addEventListener('dblclick', function (ev) {
    if (ev.target.tagName === 'TEXTAREA') return;
    var el = ev.target.closest('[data-k]'); if (!el || el.dataset.c === 'today') return;
    select({ k: el.dataset.k, c: Number(el.dataset.c) }, false); startEdit();
  });
  $('footTxt').addEventListener('click', function (ev) { if (ev.target.tagName === 'TEXTAREA') return; select({ k: 'foot', c: -2 }, false); });
  $('footTxt').addEventListener('dblclick', function () { select({ k: 'foot', c: -2 }, false); startEdit(); });
  $('fbEdit').addEventListener('click', startEdit);
  function saveMgr() {
    var s = $('mgrS').value, e = $('mgrE').value, n = $('mgrName').value.trim() || '淡水經理會議';
    if (!s || !e) return;
    if (e < s) { toast('結束日不能早於開始日'); return; }
    var data = { name: n, start: s, end: e };
    meta.mgr = data;
    backend.put('meta', 'mgr', data).catch(function (err) { toast('儲存失敗：' + ((err && err.message) || '請稍後再試')); });
    render();
  }
  ['mgrName', 'mgrS', 'mgrE'].forEach(function (id) { $(id).addEventListener('change', saveMgr); });
  $('sheet').addEventListener('keydown', function (ev) {
    if (editing || ev.target.tagName === 'TEXTAREA') return;
    var order = ALL.map(function (d) { return d.k; });
    var ri = order.indexOf(sel.k), c = sel.c, nc = c, nr = ri;
    var minC = hideB ? 0 : -1;
    if (ev.key === 'ArrowRight') nc = Math.min(28, c + 1);
    else if (ev.key === 'ArrowLeft') nc = Math.max(minC, c - 1);
    else if (ev.key === 'ArrowDown') nr = Math.min(order.length - 1, ri + 1);
    else if (ev.key === 'ArrowUp') nr = Math.max(0, ri - 1);
    else if (ev.key === 'Enter' || ev.key === 'F2') { ev.preventDefault(); startEdit(); return; }
    else return;
    ev.preventDefault();
    if (nc === -2) nc = -1;
    if (nc < 0 && (order[nr] === 'wd' || order[nr] === 'dow')) nc = 0;
    select({ k: order[nr], c: nc }, true);
  });
  function go(delta) { if (editing) commit(); viewIdx += delta; render(); }
  $('prev').addEventListener('click', function () { go(-1); });
  $('next').addEventListener('click', function () { go(1); });
  $('goToday').addEventListener('click', function () {
    if (editing) commit();
    todayDn = localToday(); viewIdx = wmOf(todayDn).idx;
    var col = null; buildCols(); cols.forEach(function (x) { if (x.dn === todayDn) col = x; });
    sel = { k: 'field', c: col ? col.i : 1 }; render(); applySel(true);
  });
  $('toggleB').addEventListener('click', function () {
    if (editing) commit();
    hideB = !hideB; try { localStorage.setItem('sched2.hideB', hideB ? '1' : '0'); } catch (e) {}
    if (hideB && sel.c === -1) sel = { k: sel.k, c: 0 };
    render();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    var n = localToday(); if (n !== todayDn) { todayDn = n; if (!editing) render(); }
  });

  /* ---------- storage ---------- */
  function dbBackend(db) {
    var q = {};
    function chain(key, fn) { q[key] = (q[key] || Promise.resolve()).then(fn, fn); return q[key]; }
    return {
      sub: function (name, cb, err) {
        return db.collection(name).onSnapshot(function (snap) {
          var o = {}; snap.docs.forEach(function (d) { o[d.id] = d.data(); });
          cb(o, snap.metadata.fromCache);
        }, err);
      },
      put: function (name, id, data) { return chain(name + '/' + id, function () { return db.collection(name).doc(id).set(data); }); },
      del: function (name, id) { return chain(name + '/' + id, function () { return db.collection(name).doc(id).delete(); }); }
    };
  }
  function localBackend() {
    var subs = {};
    function load(n) { try { return JSON.parse(localStorage.getItem('sched2.' + n)) || {}; } catch (e) { return {}; } }
    function save(n, o) { try { localStorage.setItem('sched2.' + n, JSON.stringify(o)); } catch (e) {} }
    return {
      sub: function (name, cb) { subs[name] = cb; cb(load(name), false); },
      put: function (name, id, data) { var o = load(name); o[id] = data; save(name, o); return Promise.resolve(); },
      del: function (name, id) { var o = load(name); delete o[id]; save(name, o); return Promise.resolve(); }
    };
  }
  /* Google Apps Script + Google Sheet as the shared store (used when the page is hosted outside claude.ai). */
  function gasBackend(url) {
    var subs = {}, inflight = 0, lastW = 0, timer = null, KEY = 'sched2.key', authed = false, needKey = false, queue = [];
    function getKey() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
    function post(body) {
      body.key = getKey();
      return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && j.error === 'auth') { authed = false; needKey = true; askKey(); throw new Error('共用密碼不正確'); }
          if (j && j.error) throw new Error(j.error);
          return j;
        });
    }
    function askKey() {
      var b = $('banner'); b.hidden = false;
      if ($('keyIn')) return;
      b.textContent = '尚未同步：請輸入共用密碼（Apps Script 裡設定的那組）。輸入前的修改不會存到雲端，輸入後會自動補存。';
      var i = document.createElement('input'); i.type = 'password'; i.id = 'keyIn'; i.style.margin = '0 6px'; i.setAttribute('aria-label', '共用密碼');
      var ok = h('button', 'btn primary', '確認');
      function submit() {
        try { localStorage.setItem(KEY, i.value); } catch (e) {}
        b.hidden = true; b.textContent = ''; pull(true);
      }
      ok.addEventListener('click', submit);
      i.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') submit(); });
      b.appendChild(i); b.appendChild(ok);
      setSync('warn', '未同步：需要密碼');
    }
    function flush() {
      var q = queue.splice(0, queue.length);
      return q.reduce(function (p, op) { return p.then(function () { return post(op); }); }, Promise.resolve())
        .then(function () { lastW = Date.now(); toast('已補存先前未同步的內容', 4000); })
        .catch(function () { queue = q.concat(queue); throw new Error('補存失敗'); });
    }
    function applyAll(j) {
      ['cells', 'rowNotes', 'meta'].forEach(function (n) { if (subs[n]) subs[n](j[n] || {}, false); });
      var d = new Date(); setSync('on', '已同步 ' + pad(d.getHours()) + ':' + pad(d.getMinutes()));
    }
    function pull(force) {
      if (!force && (inflight || editing || Date.now() - lastW < 4000)) return;
      post({ op: 'all' }).then(function (j) {
        authed = true; needKey = false;
        if (queue.length) { return flush().then(function () { lastW = 0; pull(true); }); }
        var empty = !Object.keys(j.cells || {}).length && !Object.keys(j.rowNotes || {}).length && !Object.keys(j.meta || {}).length;
        if (empty && window.SCHED_SEED) {
          var seed = window.SCHED_SEED, jobs = [];
          Object.keys(seed).forEach(function (n) { Object.keys(seed[n]).forEach(function (id) { jobs.push(post({ op: 'put', name: n, id: id, data: seed[n][id] })); }); });
          Promise.all(jobs).then(function () { applyAll(seed); });
        } else applyAll(j);
      }).catch(function (e) { if (!/密碼/.test(e.message)) setSync('warn', '連不上 Google，稍後自動重試'); });
    }
    function write(op, name, id, data) {
      var job = { op: op, name: name, id: id, data: data };
      if (!authed) {
        queue.push(job);
        return Promise.reject(new Error(needKey ? '尚未輸入共用密碼，輸入後會自動補存' : '尚未連上 Google，連上後會自動補存'));
      }
      inflight++;
      return post(job).then(function () { lastW = Date.now(); })
        .then(function (v) { inflight--; return v; }, function (e) { inflight--; queue.push(job); throw e; });
    }
    return {
      sub: function (name, cb) {
        subs[name] = cb;
        if (!timer) {
          timer = setInterval(function () { if (!document.hidden) pull(); }, 20000);
          document.addEventListener('visibilitychange', function () { if (!document.hidden) pull(); });
          pull();
        }
      },
      put: function (name, id, data) { return write('put', name, id, data); },
      del: function (name, id) { return write('del', name, id); }
    };
  }
  function onData(which) {
    return function (o, cached) {
      if (which === 'cells') cellsMap = o; else if (which === 'rowNotes') notes = o; else meta = o;
      if (which === 'cells' && !cached) setSync('on', '已同步');
      if (editing) pending = true; else render();
    };
  }
  function start(db) {
    if (db) {
      backend = dbBackend(db);
      setSync('', '同步中…');
      var timer = setTimeout(function () { setSync('warn', '尚未連上，資料可能不是最新'); }, 10000);
      var fail = function () {
        clearTimeout(timer); setSync('warn', '同步中斷');
        $('banner').hidden = false; $('banner').textContent = '目前無法讀取雲端資料，請確認已登入 claude.ai 後重新整理。';
      };
      ['cells', 'rowNotes', 'meta'].forEach(function (n) {
        backend.sub(n, function (o, cached) { if (!cached) clearTimeout(timer); onData(n)(o, cached); }, fail);
      });
    } else if (window.SCHED_API) {
      backend = gasBackend(window.SCHED_API);
      setSync('', '連線 Google…');
      ['cells', 'rowNotes', 'meta'].forEach(function (n) { backend.sub(n, onData(n)); });
    } else {
      backend = localBackend();
      setSync('warn', '僅存在這台瀏覽器');
      $('banner').hidden = false;
      $('banner').textContent = '目前沒有連上雲端同步，輸入的內容只會存在這台瀏覽器。登入 claude.ai 後開啟同一個網址即可同步。';
      ['cells', 'rowNotes', 'meta'].forEach(function (n) { backend.sub(n, onData(n)); });
    }
  }

  buildCols();
  var tc = null; cols.forEach(function (x) { if (x.dn === todayDn) tc = x; });
  if (tc) sel = { k: 'field', c: tc.i };
  render();
  if (window.claude && window.claude.use) window.claude.use('db').then(start, function () { start(null); });
  else start(null);
})();
</script>
</body></html>
